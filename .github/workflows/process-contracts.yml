name: process execution contracts

on:
  pull_request:
    paths:
      - index.js
      - lib/run.sh
      - test/process-contracts.e2e.test.js
      - package.json
      - .github/workflows/process-contracts.yml
  push:
    branches: [master]
    paths:
      - index.js
      - lib/run.sh
      - test/process-contracts.e2e.test.js
      - package.json
      - .github/workflows/process-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Run concurrency, failure aggregation, and side-effect journeys
        run: node --test test/process-contracts.e2e.test.js
